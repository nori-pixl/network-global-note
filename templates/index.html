<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN BBS</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .hidden { display: none; }
        input, textarea { background: #1e293b !important; color: white !important; border: 1px solid #334155 !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto">
        
        <div id="view-login" class="glass p-10 mt-20 max-w-md mx-auto">
            <h1 class="text-2xl font-bold mb-6 text-center text-sky-400">入室</h1>
            <input type="text" id="username" placeholder="名前" class="w-full p-3 rounded-xl mb-4">
            <input type="password" id="password" placeholder="パス" class="w-full p-3 rounded-xl mb-6">
            <button onclick="auth()" class="w-full bg-sky-600 py-3 rounded-xl font-bold">入室する</button>
        </div>

        <div id="view-index" class="hidden">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-sky-400">◎live: スレッド</h1>
                <button onclick="logout()" class="text-xs text-slate-500 underline">ログアウト</button>
            </header>
            <div class="glass p-6 mb-6">
                <div class="flex gap-4">
                    <input type="text" id="new-thread-title" placeholder="スレタイ..." class="flex-grow p-2 rounded-xl">
                    <button onclick="createThread()" class="bg-sky-600 px-6 py-2 rounded-xl font-bold">作成</button>
                </div>
            </div>
            <div id="thread-list" class="grid gap-4"></div>
        </div>

        <div id="view-thread" class="hidden">
            <button onclick="showIndex()" class="mb-4 text-sky-500 text-sm">← 戻る</button>
            <h2 id="thread-title" class="text-xl font-bold mb-4 px-2"></h2>
            <div id="post-list" class="glass p-6 mb-6 min-h-[300px]"></div>
            <div id="post-form-container">
                <textarea id="post-body" placeholder="メッセージ..." class="w-full p-4 rounded-xl mb-4" rows="3"></textarea>
                <button onclick="addPost()" class="w-full bg-sky-600 py-3 rounded-xl font-bold">送信</button>
            </div>
        </div>
    </div>

    <script>
        let currentThreadId = null;
        let autoRefresh = null;
        let myName = "";

        async function auth() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({u, p})
            });
            if (res.ok) {
                myName = u;
                localStorage.setItem('bbs_auth', btoa(JSON.stringify({u, p})));
                showIndex();
            } else { alert("失敗"); }
        }

        async function showIndex() {
            if(autoRefresh) clearInterval(autoRefresh);
            currentThreadId = null;
            showView('view-index');
            const res = await fetch('/api/threads');
            const threads = await res.json();
            document.getElementById('thread-list').innerHTML = threads.map(t => `
                <div class="glass p-5 flex justify-between items-center hover:bg-slate-800 transition">
                    <div onclick="showThread('${t.id}')" class="flex-grow cursor-pointer">
                        <span>◎live: ${t.title}</span>
                        <span class="text-sky-500 font-bold ml-2">${t.count}/300</span>
                    </div>
                    <button onclick="deleteThread('${t.id}')" class="text-red-900 hover:text-red-500 text-xs">削除</button>
                </div>
            `).join('') || '<p class="text-center">なし</p>';
        }

        async function showThread(id) {
            currentThreadId = id;
            showView('view-thread');
            await loadPosts();
            if(autoRefresh) clearInterval(autoRefresh);
            autoRefresh = setInterval(loadPosts, 3000);
        }

        async function loadPosts() {
            if(!currentThreadId) return;
            const res = await fetch(`/api/thread/${currentThreadId}`);
            const data = await res.json();
            document.getElementById('thread-title').innerText = data.title;
            document.getElementById('post-list').innerHTML = data.posts.map((p, i) => `
                <div class="border-b border-slate-800 py-4 flex justify-between items-start">
                    <div>
                        <div class="text-xs text-slate-500">${i+1}: ${p.name}</div>
                        <div class="mt-1 whitespace-pre-wrap">${p.body}</div>
                    </div>
                    ${p.name === myName ? `<button onclick="deletePost(${p.id})" class="text-red-900 text-[10px]">削除</button>` : ''}
                </div>
            `).join('');
            document.getElementById('post-form-container').style.display = data.is_locked ? 'none' : 'block';
        }

        async function deleteThread(id) {
            if(confirm("スレを消しますか？")) {
                await fetch(`/api/delete_thread/${id}`, {method: 'POST'});
                showIndex();
            }
        }

        async function deletePost(postId) {
            if(confirm("投稿を消しますか？")) {
                await fetch(`/api/delete_post/${postId}`, {method: 'POST'});
                loadPosts();
            }
        }

        async function createThread() {
            const title = document.getElementById('new-thread-title').value;
            if(!title) return;
            await fetch('/api/create_thread', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });
            document.getElementById('new-thread-title').value = '';
            showIndex();
        }

        async function addPost() {
            const body = document.getElementById('post-body').value;
            if(!body) return;
            await fetch(`/api/post/${currentThreadId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({body})
            });
            document.getElementById('post-body').value = '';
            loadPosts();
        }

        function showView(viewId) {
            ['view-login', 'view-index', 'view-thread'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function logout() { localStorage.removeItem('bbs_auth'); location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem('bbs_auth');
            if (saved) {
                const data = JSON.parse(atob(saved));
                document.getElementById('username').value = data.u;
                document.getElementById('password').value = data.p;
                auth();
            }
        };
    </script>
</body>
</html>
