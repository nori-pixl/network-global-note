<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN BBS</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .hidden { display: none; }
        input, textarea { background: #1e293b !important; color: white !important; border: 1px solid #334155 !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto">
        
        <!-- 1. ログイン画面 -->
        <div id="view-login" class="glass p-10 mt-20 max-w-md mx-auto">
            <h1 class="text-2xl font-bold mb-6 text-center text-sky-400">入室</h1>
            <input type="text" id="username" placeholder="アカウント名" class="w-full p-3 rounded-xl mb-4">
            <input type="password" id="password" placeholder="パスワード" class="w-full p-3 rounded-xl mb-6">
            <button onclick="auth()" class="w-full bg-sky-600 py-3 rounded-xl font-bold hover:bg-sky-500 transition">入室する</button>
        </div>

        <!-- 2. スレッド一覧画面 -->
        <div id="view-index" class="hidden">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-sky-400">◎live: スレッド一覧</h1>
                <button onclick="logout()" class="text-xs text-slate-500 underline">ログアウト</button>
            </header>
            <div class="glass p-6 mb-6">
                <div class="flex gap-4">
                    <input type="text" id="new-thread-title" placeholder="新しいスレッドのタイトル..." class="flex-grow p-2 rounded-xl">
                    <button onclick="createThread()" class="bg-sky-600 px-6 py-2 rounded-xl font-bold">作成</button>
                </div>
            </div>
            <div id="thread-list" class="grid gap-4"></div>
        </div>

        <!-- 3. スレッド詳細画面（自動更新） -->
        <div id="view-thread" class="hidden">
            <button onclick="showIndex()" class="mb-4 text-sky-500 text-sm">← 一覧に戻る</button>
            <h2 id="thread-title" class="text-xl font-bold mb-4 px-2"></h2>
            <div id="post-list" class="glass p-6 mb-6 min-h-[300px]"></div>
            <div id="post-form-container">
                <textarea id="post-body" placeholder="メッセージを入力..." class="w-full p-4 rounded-xl mb-4" rows="3"></textarea>
                <button onclick="addPost()" class="w-full bg-sky-600 py-3 rounded-xl font-bold hover:bg-sky-500 transition">送信</button>
            </div>
        </div>

    </div>

    <script>
        let currentThreadId = null;
        let autoRefreshInterval = null;

        // 画面切り替え関数
        function showView(viewId) {
            ['view-login', 'view-index', 'view-thread'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        // 入室（API接続）
        async function auth() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("入力してください");

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({u, p})
            });
            if (res.ok) {
                localStorage.setItem('bbs_auth', btoa(JSON.stringify({u, p})));
                showIndex();
            } else {
                alert("入室に失敗しました。パスワードが違うか、サーバーエラーです。");
            }
        }

        // スレ一覧表示
        async function showIndex() {
            if(autoRefreshInterval) clearInterval(autoRefreshInterval);
            currentThreadId = null;
            showView('view-index');
            const res = await fetch('/api/threads');
            const threads = await res.json();
            const list = document.getElementById('thread-list');
            list.innerHTML = threads.map(t => `
                <div onclick="showThread('${t.id}')" class="glass p-5 flex justify-between cursor-pointer hover:bg-slate-800 transition">
                    <span>◎live: ${t.title}</span>
                    <span class="text-sky-500 font-bold">${t.count}/300</span>
                </div>
            `).join('') || '<p class="text-center text-slate-500">まだスレがありません</p>';
        }

        // スレ詳細（自動更新開始）
        async function showThread(id) {
            currentThreadId = id;
            showView('view-thread');
            await loadPosts(); // 初回読み込み
            
            // 3秒ごとに自動更新
            if(autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(loadPosts, 3000);
        }

        // 投稿データ読み込み用
        async function loadPosts() {
            if(!currentThreadId) return;
            const res = await fetch(`/api/thread/${currentThreadId}`);
            const data = await res.json();
            document.getElementById('thread-title').innerText = data.title;
            document.getElementById('post-list').innerHTML = data.posts.map((p, i) => `
                <div class="border-b border-slate-800 py-4">
                    <div class="text-xs text-slate-500 mb-1">${i+1}: ${p.name}</div>
                    <div class="whitespace-pre-wrap">${p.body}</div>
                </div>
            `).join('') || '<p class="text-center text-slate-500">まだ投稿がありません</p>';
            
            // 300件制限
            document.getElementById('post-form-container').style.display = data.is_locked ? 'none' : 'block';
        }

        async function createThread() {
            const title = document.getElementById('new-thread-title').value;
            if(!title) return;
            await fetch('/api/create_thread', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });
            document.getElementById('new-thread-title').value = '';
            showIndex();
        }

        async function addPost() {
            const body = document.getElementById('post-body').value;
            if(!body) return;
            await fetch(`/api/post/${currentThreadId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({body})
            });
            document.getElementById('post-body').value = '';
            loadPosts(); // 即時反映
        }

        function logout() {
            localStorage.removeItem('bbs_auth');
            location.reload();
        }

        // 自動ログイン
        window.onload = () => {
            const saved = localStorage.getItem('bbs_auth');
            if (saved) {
                const data = JSON.parse(atob(saved));
                document.getElementById('username').value = data.u;
                document.getElementById('password').value = data.p;
                auth();
            }
        };
    </script>
</body>
</html>
